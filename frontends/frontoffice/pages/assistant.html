<section aria-labelledby="assistant-heading">
    <h1 id="assistant-heading">Basil-care assistant</h1>
    <p>Ask about basil care and check the sources behind each answer.</p>
    <p class="banner">Questions are sent to Google Gemini with public gardening notes. Please do not include personal or private information. This assistant cannot read sensors, diagnose plants or control the pump.</p>
    <form id="assistant-form" class="card">
        <label for="assistant-question">Your question (English)</label>
        <textarea id="assistant-question" rows="3" maxlength="2000" required placeholder="How should I prune basil?"></textarea>
        <button class="primary" id="assistant-send" type="submit">Ask</button>
        <p id="assistant-status" role="status" aria-live="polite"></p>
    </form>
    <div id="assistant-messages" aria-label="Questions and answers"></div>
</section>
