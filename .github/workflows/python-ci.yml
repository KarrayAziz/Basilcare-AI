name: Edge and simulator CI

on:
  pull_request:
    paths:
      - "iot/edge/**"
      - "iot/simulator/**"
      - ".github/workflows/python-ci.yml"
  push:
    branches: [main]
    paths:
      - "iot/edge/**"
      - "iot/simulator/**"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The runner's Python 3 is used (3.11+ needed for tomllib).
      - name: Install dependencies
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install -r iot/edge/requirements.txt -r iot/simulator/requirements.txt

      - name: Simulator tests
        working-directory: iot/simulator
        run: ../../.venv/bin/python -m unittest -v

      - name: Edge gateway tests
        working-directory: iot/edge
        run: ../../.venv/bin/python -m unittest discover -s tests -t . -v
