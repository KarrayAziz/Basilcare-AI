# Development broker configuration (mounted by deploy/compose.yaml).
#
# persistence: sessions, subscriptions and queued QoS 1 messages are saved to disk, so a
# broker restart does not forget Node-RED's persistent session. Without it, the readings a
# gateway sends right after the restart (its offline backlog) reach a broker with no
# subscriber yet and are dropped. Found by the edge outage test: 8 readings lost without
# persistence, none with it.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# Anonymous access on 1883: DEVELOPMENT ONLY. Production: TLS on 8883, one login per
# device and per backend service, access-control list (docs/mqtt-contract.md section 9).
listener 1883
allow_anonymous true

log_dest stdout
log_type error
log_type warning
log_type notice
