# Production stack (what start.sh runs): docker compose -f deploy/compose.yaml up -d
# Live-editing the code: add -f deploy/compose.dev.yaml (mounts local WARs and frontends).
# Values like ${INGEST_KEY:-dev-ingest-key} come from deploy/.env (copy .env.example);
# the text after ":-" is a development default only. Production values are never committed.
name: basilcare

services:
  mongodb:
    image: mongo:7.0
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]   # this machine only, for MongoDB Compass
    volumes: [mongo-data:/data/db]

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro   # anonymous + persistence (development)
      - mosquitto-data:/mosquitto/data      # sessions and queued messages survive a broker restart

  nodered:
    image: nodered/node-red:4.0.9
    ports: ["1880:1880"]                    # editor: http://localhost:1880
    environment:
      TZ: Africa/Tunis                      # local time in the Node-RED log
      MQTT_HOST: mosquitto                  # used by the flow's broker node: ${MQTT_HOST}
      MQTT_PORT: "1883"
      API_URL: http://wildfly:8080/api      # where checked messages are sent (/api/ingest/...)
      INGEST_KEY: ${INGEST_KEY:-dev-ingest-key}                     # must equal the API's
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:-}   # empty in development
      NODE_RED_ADMIN_HASH: ${NODE_RED_ADMIN_HASH:-}                 # empty = editor without login
    volumes:
      - ../iot/node-red:/data               # Deploy in the editor saves to the repository's flows.json
    depends_on: [mosquitto]

  wildfly:
    # Published by .github/workflows/release.yml for Intel and Apple Silicon. "build" lets the
    # same service be built from this checkout instead (docker compose build wildfly).
    image: ${BASILCARE_IMAGE:-ghcr.io/karrayaziz/basilcare-wildfly}:${BASILCARE_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/wildfly/Dockerfile
    ports:
      - "${HTTPS_PORT:-443}:8443"            # https://basilcare.test (TLS_HOSTNAME in the hosts file)
      - "127.0.0.1:8080:8080"                # plain HTTP for local health checks only
    environment:
      TZ: Africa/Tunis                       # offsets in API timestamps (+01:00)
      JNOSQL_MONGODB_HOST: mongodb:27017     # overrides jnosql.mongodb.host
      MQTT_BROKER_URL: tcp://mosquitto:1883  # the API publishes pump commands
      ASSISTANT_SERVICE_KEY: ${ASSISTANT_SERVICE_KEY:-}
      INGEST_KEY: ${INGEST_KEY:-dev-ingest-key}   # Node-RED -> API service key
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      TENANT_FARMER_REDIRECT: ${FARMER_ORIGIN:-https://www.basilcare.test}/
      TENANT_ADMIN_REDIRECT: ${ADMIN_ORIGIN:-https://admin.basilcare.test}/
      CORS_ALLOWED_ORIGINS: ${FARMER_ORIGIN:-https://www.basilcare.test},${ADMIN_ORIGIN:-https://admin.basilcare.test}
      TLS_HOSTNAME: ${TLS_HOSTNAME:-basilcare.test}            # name in the self-signed certificate
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:-changeit}
      BASILCARE_HOSTING_PROPERTIES: /opt/jboss/wildfly/hosting/pwas-${HOSTING_ENV:-prod}.properties
    volumes:
      - wildfly-certs:/opt/jboss/wildfly/certs   # keystore survives container replacement
    depends_on: [mongodb, mosquitto]

  assistant:
    # Internal-only Python service: no published ports; only the API has its service key.
    image: python:3.12-slim
    working_dir: /app
    command: python -m basilcare_assistant.http_server
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      ASSISTANT_SERVICE_KEY: ${ASSISTANT_SERVICE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    volumes:
      - ../iot/ai/service:/app:ro

  simulator:
    # Optional virtual Raspberry Pi for demos without hardware:
    #   docker compose -f deploy/compose.yaml --profile demo up -d
    profiles: [demo]
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -q --disable-pip-version-check --root-user-action=ignore -r requirements.txt && exec python simulator.py --host mosquitto --fault ${SIMULATOR_FAULT:-ph-drift}"
    volumes:
      - ../iot/simulator:/app:ro
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on: [mosquitto]

volumes:
  mongo-data:
  mosquitto-data:
  wildfly-certs:
