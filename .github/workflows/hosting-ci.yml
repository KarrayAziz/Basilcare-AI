name: WildFly PWA hosting CI

on:
  pull_request:
    paths: ["deploy/**", "frontends/frontoffice/**", "frontends/backoffice/**", "middleware/api/**", "middleware/iam/**", ".dockerignore", ".github/workflows/hosting-ci.yml"]
  push:
    branches: [main]
    paths: ["deploy/**", "frontends/frontoffice/**", "frontends/backoffice/**", "middleware/api/**", "middleware/iam/**", ".dockerignore", ".github/workflows/hosting-ci.yml"]

permissions:
  contents: read

jobs:
  verify-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: https://basilcare.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check frontend identity, redirects and cache isolation
        run: node --test frontends/frontoffice/test/*.mjs frontends/backoffice/test/*.js
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - name: Build and test both Java applications
        run: |
          mvn --batch-mode --no-transfer-progress --file middleware/iam/pom.xml verify
          mvn --batch-mode --no-transfer-progress --file middleware/api/pom.xml verify
      - name: Build the production WildFly image
        run: docker compose -p hosting-ci -f deploy/compose.yaml build wildfly
      - name: Resolve basilcare.test like a laptop's hosts file
        run: echo "127.0.0.1 basilcare.test www.basilcare.test admin.basilcare.test api.basilcare.test iam.basilcare.test" | sudo tee -a /etc/hosts
      - name: Start isolated MongoDB and WildFly services
        run: docker compose -p hosting-ci -f deploy/compose.yaml up -d --no-build --no-deps mongodb wildfly
      - name: Verify HTTPS, static hosting and PKCE against the self-signed certificate
        run: |
          bash deploy/wait_ready.sh "$BASE"
          mkdir -p deploy/certs
          docker compose -p hosting-ci -f deploy/compose.yaml cp wildfly:/opt/jboss/wildfly/certs/basilcare.crt deploy/certs/basilcare.crt
          python3 deploy/hosting_smoke_test.py --base "$BASE" --cafile deploy/certs/basilcare.crt
      - name: Verify configuration and certificate survive a restart
        run: |
          docker compose -p hosting-ci -f deploy/compose.yaml restart wildfly
          bash deploy/wait_ready.sh "$BASE"
          python3 deploy/hosting_smoke_test.py --base "$BASE" --cafile deploy/certs/basilcare.crt
      - name: Check login and cross-origin requests in Chromium
        run: |
          npm install --prefix /tmp/basilcare-browser --no-save playwright@1.56.1
          /tmp/basilcare-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/basilcare-browser/node_modules node deploy/browser_hosting_test.cjs
      - name: Service logs
        if: always()
        run: docker compose -p hosting-ci -f deploy/compose.yaml logs --tail=160 wildfly mongodb
      - name: Clean up isolated services
        if: always()
        run: docker compose -p hosting-ci -f deploy/compose.yaml down --volumes
