name: Release (CD)

# Every push to main publishes a tested WildFly image (iam.war + api.war + both PWAs + HTTPS
# configuration) for Intel and Apple Silicon to GitHub Container Registry, then starts the
# published image and checks it. A tag v1.2.3 also creates a GitHub Release.
# Anyone can then run the platform with only Docker:  git clone ... && bash start.sh

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Frontend checks
        run: node --test frontends/frontoffice/test/*.mjs frontends/backoffice/test/*.js
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - name: Build and test IAM and API
        run: |
          mvn --batch-mode --no-transfer-progress --file middleware/iam/pom.xml verify
          mvn --batch-mode --no-transfer-progress --file middleware/api/pom.xml verify

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name (registry paths must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/basilcare-wildfly" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/wildfly/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://basilcare.test
      BASILCARE_IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Start the published image exactly as start.sh does
        run: |
          export BASILCARE_VERSION="sha-${GITHUB_SHA::7}"
          echo "127.0.0.1 basilcare.test" | sudo tee -a /etc/hosts
          docker compose -f deploy/compose.yaml pull mongodb wildfly
          docker compose -f deploy/compose.yaml up -d --no-build --no-deps mongodb wildfly
      - name: HTTPS, PWAs and sign-in work
        run: |
          bash deploy/wait_ready.sh "$BASE"
          mkdir -p deploy/certs
          docker compose -f deploy/compose.yaml cp wildfly:/opt/jboss/wildfly/certs/basilcare.crt deploy/certs/basilcare.crt
          python3 deploy/hosting_smoke_test.py --base "$BASE" --cafile deploy/certs/basilcare.crt
      - name: Service logs
        if: always()
        run: docker compose -f deploy/compose.yaml logs --tail=160 wildfly
      - name: Clean up
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --notes "Run it with Docker only: \`git clone\` this tag, then \`bash start.sh\`. Image: \`$IMAGE:${GITHUB_REF_NAME#v}\`"
