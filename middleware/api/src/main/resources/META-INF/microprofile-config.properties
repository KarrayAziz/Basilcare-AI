# Development defaults. Any key can be overridden by an environment variable:
# dots -> underscores, upper case. Example: mqtt.broker.url -> MQTT_BROKER_URL
# Secrets (ingest.key, mqtt.password) are NEVER written here.

# Must match the IAM's jwt.issuer
jwt.issuer=urn:basilcare:iam
# Where the public keys are published (same WildFly in development)
jwt.jwks.url=http://localhost:8080/iam/jwk
cors.allowed.origins=http://localhost:8080

# Persistence (devices, readings, incidents, pump audit...)
jnosql.document.database=basilcare_api
jnosql.mongodb.host=localhost:27017
jnosql.document.provider=org.eclipse.jnosql.databases.mongodb.communication.MongoDBDocumentConfiguration

# Node-RED -> API ingestion. The key is set with the INGEST_KEY environment variable;
# without it /api/ingest/* answers 503 (fail closed).

# MQTT broker used to publish pump commands (mqtt.username / mqtt.password from the environment)
mqtt.broker.url=tcp://localhost:1883

# Pump safety policy of the API (the device applies its own limits again, contract section 5.2).
# Placeholders to agree on with the team (contract section 10).
pump.max.duration.s=900
pump.min.water.level=20
pump.command.ttl.s=60
